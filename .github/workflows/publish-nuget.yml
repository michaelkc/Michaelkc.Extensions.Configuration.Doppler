name: Publish NuGet package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-pack-publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_PATH: src/DopplerSDK.ConfigurationProvider/DopplerSDK.ConfigurationProvider.csproj
      PACKAGE_OUTPUT: artifacts/nuget
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          dotnet tool update --global minver-cli --version 7.*
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

          $minVerVersion = (minver --verbosity e).Trim()
          if (-not $minVerVersion) {
            throw "MinVer did not return a version."
          }

          $isPullRequest = "${{ github.event_name }}" -eq "pull_request"
          $packageVersion = ""
          $shouldPublish = "false"

          if ($isPullRequest) {
            $baseVersion = $minVerVersion.Split("-")[0]
            $packageVersion = "$baseVersion-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
            $shouldPublish = "true"
          }
          elseif (-not $minVerVersion.Contains("-")) {
            $packageVersion = $minVerVersion
            $shouldPublish = "true"
          }
          else {
            Write-Host "Main build is not a stable MinVer tag version ($minVerVersion). Package will be built but not published."
          }

          "minver_version=$minVerVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_publish=$shouldPublish" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} --nologo

      - name: Build (Release)
        shell: pwsh
        run: |
          $buildArgs = @(
            "build",
            "${{ env.PROJECT_PATH }}",
            "--configuration", "Release",
            "--no-restore",
            "--nologo"
          )

          if ("${{ steps.version.outputs.package_version }}") {
            $buildArgs += "-p:MinVerVersionOverride=${{ steps.version.outputs.package_version }}"
          }

          dotnet @buildArgs

      - name: Pack
        shell: pwsh
        run: |
          $packArgs = @(
            "pack",
            "${{ env.PROJECT_PATH }}",
            "--configuration", "Release",
            "--output", "${{ env.PACKAGE_OUTPUT }}",
            "--no-build",
            "--nologo"
          )

          if ("${{ steps.version.outputs.package_version }}") {
            $packArgs += "-p:MinVerVersionOverride=${{ steps.version.outputs.package_version }}"
          }

          dotnet @packArgs

      - name: NuGet login (trusted publishing)
        if: steps.version.outputs.should_publish == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages to NuGet.org
        if: steps.version.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          Get-ChildItem "${{ env.PACKAGE_OUTPUT }}" -Filter *.nupkg |
            Where-Object { $_.Name -notlike "*.symbols.nupkg" } |
            ForEach-Object {
              dotnet nuget push $_.FullName `
                --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
                --source "${{ env.NUGET_SOURCE }}" `
                --skip-duplicate
            }
